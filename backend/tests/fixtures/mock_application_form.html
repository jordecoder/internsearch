<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mock Internship Application</title>
</head>
<body>
<h1>Apply — Software Engineering Intern</h1>
<form id="application-form">

  <div>
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name">
  </div>

  <div>
    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="last_name">
  </div>

  <div>
    <label for="email">Email</label>
    <input type="email" id="email" name="email">
  </div>

  <div>
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone">
  </div>

  <div>
    <label for="linkedin">LinkedIn Profile</label>
    <input type="text" id="linkedin" name="linkedin">
  </div>

  <div>
    <label for="resume">Resume/CV</label>
    <input type="file" id="resume" name="resume">
  </div>

  <div>
    <label for="school">School</label>
    <select id="school" name="school">
      <option value="">Select one</option>
      <option value="nus">National University of Singapore</option>
      <option value="ntu">Nanyang Technological University</option>
      <option value="smu">Singapore Management University</option>
    </select>
  </div>

  <fieldset>
    <legend>Are you legally authorized to work in this country?</legend>
    <label><input type="radio" name="work_auth" value="yes"> Yes</label>
    <label><input type="radio" name="work_auth" value="no"> No</label>
  </fieldset>

  <div>
    <label for="why">Why do you want to work here?</label>
    <textarea id="why" name="why" maxlength="500"></textarea>
  </div>

  <div>
    <label for="project">Tell us about a project you're proud of</label>
    <textarea id="project" name="project" maxlength="500"></textarea>
  </div>

  <button type="submit" id="submit-btn" onclick="window.__submitClicked = (window.__submitClicked || 0) + 1; return false;">
    Submit Application
  </button>

</form>
</body>
</html>
