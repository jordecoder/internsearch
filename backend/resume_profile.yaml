# ── Career-fit profile ──────────────────────────────────────────────────────
# Used by career_scoring.py to judge not just "am I qualified" but "does this
# role move me toward my actual target career" — see career_scoring.py for how
# this feeds the LLM rubric.

# Priority order matters: earlier entries score higher on Career Direction Fit.
target_career_paths:
  - Data Engineer
  - AI Engineer / Applied AI Engineer
  - ML Engineer
  - Data Platform / Data Infrastructure Engineer
  - Backend Engineer working on data-intensive systems
  - MLOps / ML Platform Engineer
  - Software Engineer with strong backend, distributed systems, data, or AI exposure
  - Quant Developer
  - Data Scientist only when the role involves substantial ML/model development or engineering

