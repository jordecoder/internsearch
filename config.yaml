log_level: INFO
database_path: jobs.sqlite3
resume_profile_path: resume_profile.yaml
posted_within_hours: 24
check_interval_minutes: 180

# LLM career-fit scoring (career_scoring.py) — scores each actionable job against
# your actual target career paths (resume_profile.yaml), not just keyword overlap.
# Needs GEMINI_API_KEY in the environment; each job is scored at most once (cached
# by stable_id), so this doesn't call Gemini on every hourly run. If the key is
# missing or a call fails, a deterministic fallback is used for *display only* —
# it never changes which alerts fire (see main.py's `effective_score` logic).
career_scoring:
  enabled: true

# "Scraping complete, about to check what's due" — fires every single pipeline
# run (hourly = up to 24x/day), unconditionally, with generic internal telemetry
# rather than anything about a specific job. heartbeat below already covers
# the "is the pipeline alive and healthy" need at a saner daily cadence.
# Disabled as the single most repetitive/low-value message type. Flip back to
# true any time if you actually want the per-run pings.
send_phase_status:
  enabled: false

heartbeat:
  enabled: true
  interval_hours: 24

near_match_digest:
  enabled: true
  interval_hours: 3
  max_items: 10
  min_overall: 55
  min_location: 70

actionable_digest:
  enabled: true
  interval_hours: 3
  max_items: 10
  exact_job_postings_only: true

new_actionable_alerts:
  enabled: true
  # Send every new exact Singapore tech internship that passes candidate filters,
  # even if it is below the stricter relevance threshold.
  min_overall: 0
  min_location: 70

exact_job_detection:
  exact_source_prefixes:
